<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Apositify">
  <title>Apositify</title>
  <!-- Colours sampled from the iOS app icon so all three clients carry the
       same mark: a scanned certificate, its seal, and an official check. -->
  <defs>
    <linearGradient id="apositify-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003CBE"/>
      <stop offset=".55" stop-color="#0B72C3"/>
      <stop offset="1" stop-color="#03D6CA"/>
    </linearGradient>
    <linearGradient id="apositify-doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF4FB"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#apositify-bg)"/>

  <!-- Scan brackets: the app reads a document rather than storing one. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
    <path d="M150,206 V172 a22,22 0 0 1 22,-22 H206"/>
    <path d="M306,150 H340 a22,22 0 0 1 22,22 V206"/>
    <path d="M150,306 V340 a22,22 0 0 0 22,22 H206"/>
    <path d="M306,362 H340 a22,22 0 0 0 22,-22 V306"/>
  </g>

  <!-- Certificate with a folded corner. -->
  <path d="M208,178 H292 L316,202 V322 a12,12 0 0 1 -12,12 H208 a12,12 0 0 1 -12,-12 V190 a12,12 0 0 1 12,-12 Z"
        fill="url(#apositify-doc)"/>
  <path d="M292,178 L316,202 H298 a6,6 0 0 1 -6,-6 Z" fill="#C9DCF2"/>

  <g fill="#7297CC">
    <rect x="216" y="210" width="58" height="9" rx="4.5"/>
    <rect x="216" y="234" width="80" height="9" rx="4.5"/>
    <rect x="216" y="258" width="80" height="9" rx="4.5"/>
    <rect x="216" y="282" width="50" height="9" rx="4.5"/>
  </g>

  <!-- Embossed seal. -->
  <circle cx="226" cy="310" r="17" fill="#E4EDF9" stroke="#A9C3E2" stroke-width="3"/>
  <circle cx="226" cy="310" r="8" fill="#A9C3E2"/>

  <!-- The authority's verdict. -->
  <circle cx="300" cy="312" r="34" fill="#FFFFFF"/>
  <circle cx="300" cy="312" r="29" fill="#1DC3A4"/>
  <path d="M287,312 l9,9 l18,-19" fill="none" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
